# Render.com blueprint — deploy TubeForge with one click:
# Render Dashboard → New → Blueprint → point at this repo.
#
# NOTE ON PLANS:
#  - "starter" + disk  = videos, database and settings survive restarts (recommended)
#  - "free"            = works, but the disk is EPHEMERAL (everything resets on
#                        redeploy/restart) and the service sleeps after 15 min idle,
#                        which pauses Auto-Pilot. Fine for testing.
services:
  - type: web
    name: tubeforge
    runtime: docker
    plan: starter # switch to "free" for testing only (no persistent disk allowed)
    healthCheckPath: /api/stats
    disk:
      name: tubeforge-data
      mountPath: /data
      sizeGB: 5 # ~1.5-2h of rendered video; grow as needed
    envVars:
      - key: DATABASE_URL
        value: file:/data/db/custom.db
      - key: MEDIA_ROOT
        value: /data/media
      # 720p renders: ~56% less CPU + RAM per frame so videos finish inside
      # the free tier's 512MB. Delete this line (or set 1080) on paid plans
      # for full HD.
      - key: RENDER_SCALE
        value: "720"
      # Auto-Pilot schedule hours follow this timezone (08:00 = 8am YOUR time).
      # Change to your own IANA zone if you are not in Nigeria.
      - key: TZ
        value: Africa/Lagos
      # NEEDED ONLY FOR SCRIPTS/SEO (glm-4.5-flash = free key from z.ai).
      # Scene images + voiceover are 100% free without any key.
      - key: ZAI_CONFIG_JSON
        sync: false
      # Optional: pre-set YouTube credentials via env instead of the Settings UI.
      # Leave commented to configure them in the dashboard instead.
      # - key: YOUTUBE_CLIENT_ID
      #   sync: false
      # - key: YOUTUBE_CLIENT_SECRET
      #   sync: false
      # - key: YOUTUBE_REFRESH_TOKEN
      #   sync: false
